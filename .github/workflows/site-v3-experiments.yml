name: Site V3 experiments — verify only

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact V3 commit SHA selected by QA (40 characters)
        required: true
        type: string
      checkpoint:
        description: QA approval reference and purpose (organizational approval)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: localagent-site-v3-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-experiments:
    if: >-
      github.repository == 'michazaval/localagent-site' &&
      github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate checkpoint inputs
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          CHECKPOINT: ${{ inputs.checkpoint }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ -n "${CHECKPOINT//[[:space:]]/}" ]]
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - name: Confirm exact V3 source
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test -f experiments/site-v3/concept-bplus/smoke.mjs
          printf 'V3 source: `%s`\n' "$SOURCE_SHA" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Unit, syntax and production build isolation
        run: |
          set -euo pipefail
          npm run build
          find experiments/site-v3 \( -name '*.js' -o -name '*.mjs' \) -print0 | while IFS= read -r -d '' file; do node --check "$file" || exit 1; done
          test ! -e dist/experiments
      - name: Install isolated browser test tools
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/v3-tools" --no-save --ignore-scripts playwright@1.64.1
          "$RUNNER_TEMP/v3-tools/node_modules/.bin/playwright" install --with-deps chromium
      - name: Bounded WebGL browser smoke
        timeout-minutes: 3
        env:
          V3_PLAYWRIGHT: '${{ runner.temp }}/v3-tools/node_modules/playwright'
        run: node experiments/site-v3/concept-bplus/smoke.mjs
