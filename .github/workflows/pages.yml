name: LocalAgent site — validate and publish

on:
  pull_request:
    branches: [main]
    paths:
      - "index.html"
      - "404.html"
      - "robots.txt"
      - "assets/**"
      - "scripts/**"
      - "tests/**"
      - "package.json"
      - ".github/workflows/pages.yml"
  push:
    branches: [main]
    paths:
      - "index.html"
      - "404.html"
      - "robots.txt"
      - "assets/**"
      - "scripts/**"
      - "tests/**"
      - "package.json"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: localagent-site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify website
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate and build static site
        run: npm run build

  deploy:
    name: Publish Pages
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'michazaval/localagent-site'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: github-pages
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build explicit website file allow-list
        run: npm run build
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site only
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
