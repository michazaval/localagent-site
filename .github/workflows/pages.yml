name: LocalAgent site — validate and publish

on:
  pull_request:
    branches: [develop, main]
    paths:
      - "index.html"
      - "404.html"
      - "robots.txt"
      - "assets/**"
      - "scripts/**"
      - "tests/**"
      - "package.json"
      - ".github/workflows/pages.yml"
  push:
    branches: [develop, main]
    paths:
      - "index.html"
      - "404.html"
      - "robots.txt"
      - "assets/**"
      - "scripts/**"
      - "tests/**"
      - "package.json"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: localagent-site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify website
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate and build static site
        run: npm run build

