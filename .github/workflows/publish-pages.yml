name: Publish stable and develop preview

on:
  workflow_dispatch:
    inputs:
      main_sha:
        description: Approved current main HEAD for Stable (40-character SHA)
        required: true
        type: string
      preview_sha:
        description: Approved current develop HEAD for Preview (40-character SHA)
        required: true
        type: string
      checkpoint:
        description: Owner publication approval reference and purpose
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: localagent-pages-publish
  cancel-in-progress: false

jobs:
  build:
    name: Build stable and preview together
    if: >-
      github.repository == 'michazaval/localagent-site' &&
      github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Validate publication inputs
        shell: bash
        env:
          MAIN_SHA: ${{ inputs.main_sha }}
          PREVIEW_SHA: ${{ inputs.preview_sha }}
          CHECKPOINT: ${{ inputs.checkpoint }}
        run: |
          set -euo pipefail
          [[ "$MAIN_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$PREVIEW_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ -n "${CHECKPOINT//[[:space:]]/}" ]]
      - name: Checkout stable main
        uses: actions/checkout@v4
        with:
          ref: main
          path: stable
          persist-credentials: false
      - name: Checkout develop preview
        uses: actions/checkout@v4
        with:
          ref: develop
          path: preview-source
          persist-credentials: false
      - name: Confirm approved branch snapshots
        shell: bash
        env:
          MAIN_SHA: ${{ inputs.main_sha }}
          PREVIEW_SHA: ${{ inputs.preview_sha }}
        run: |
          set -euo pipefail
          test "$(git -C stable rev-parse HEAD)" = "$MAIN_SHA"
          test "$(git -C preview-source rev-parse HEAD)" = "$PREVIEW_SHA"
          printf 'Stable main: `%s`\nPreview develop: `%s`\n' "$MAIN_SHA" "$PREVIEW_SHA" >> "$GITHUB_STEP_SUMMARY"
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate and build stable
        working-directory: stable
        run: npm run build
      - name: Validate and build preview
        working-directory: preview-source
        run: npm run build
      - name: Assemble GitHub Pages tree
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p publish/preview
          cp -a stable/dist/. publish/
          cp -a preview-source/dist/. publish/preview/
          test -f publish/index.html
          test -f publish/preview/index.html
          test -f publish/preview/assets/main.js
          test -f publish/preview/assets/polish.js
          echo "Stable comes only from main; preview comes only from develop."
          find publish -type f -print | sort
      - name: Upload combined site
        uses: actions/upload-pages-artifact@v3
        with:
          path: publish
          retention-days: 1

  deploy:
    name: Deploy both URLs from main workflow
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
